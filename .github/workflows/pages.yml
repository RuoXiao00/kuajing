name: Publish frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto 优先真实后端，连接失败展示样例；demo 强制展示；live 仅真实服务'
        type: choice
        required: true
        default: auto
        options: [auto, demo, live]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Read Pages address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm ci
      - run: npm run lint
      - run: npm run test:frontend
      - name: Build public frontend
        # 这里只配置公开 API 地址，不使用模型密钥或 Coze Token。
        env:
          # 默认自动检测，域名恢复后不必再改代码；手动模式优先于仓库变量。
          VITE_CONNECTION_MODE: ${{ inputs.mode || vars.PAGES_MODE || 'auto' }}
          VITE_DEMO_MODE: ${{ (inputs.mode || vars.PAGES_MODE || 'auto') == 'demo' && 'true' || 'false' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.qiyuange.online' }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_ROUTER_MODE: hash
        run: |
          node scripts/check-pages-config.mjs
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
